services:
  app:
    build:
      context: .
      target: runner
      # NEXT_PUBLIC_* values are baked into the client bundle at build time.
      # docker compose resolves these ${...} refs from .env in this same
      # directory (its own lookup, separate from the build context /
      # .dockerignore) and passes them through as build args — see the
      # Dockerfile's builder stage.
      args:
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_GSC_VERIFICATION: ${NEXT_PUBLIC_GSC_VERIFICATION:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
